# One entry per drone. Each drone gets its own USB Wi-Fi adapter.
# Required: iface, ssid, bssid, serial. 01_connect_and_view.py refuses to stream
# unless the adapter's live SSID/BSSID and the drone's sn? reply match.
#   iface:    interface connected to this drone's network
#   ssid:     the drone's Wi-Fi name
#   bssid:    the drone's access-point MAC (hardware identity); find it with
#             nmcli -f SSID,BSSID dev wifi list ifname <iface>
#   serial:   null        -> unknown; the script prints the sn? reply and exits
#             unsupported -> firmware has no sn? (SDK 1.3); identity rests on bssid
#             "0TQZ..."   -> must equal the sn? reply exactly
#   local_ip: optional; our IP on 192.168.10.0/24. null = look it up from iface.
drones:
  tello_4:
    iface: wlx58d8125ecf0d
    ssid: TELLO-4
    bssid: "60:60:1F:C7:43:9F"
    serial: unsupported
    local_ip: null
    notes: "TP-Link Archer T2U PLUS (RTL8821AU, rtw88_8821au driver)"

  tello_3:
    iface: wlx6c4cbce33375
    ssid: TELLO-3
    bssid: "60:60:1F:C7:2B:E0"
    serial: unsupported    
    local_ip: null
    notes: "Wi-Fi Stick 3"