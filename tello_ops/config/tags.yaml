# AprilTags for mapping. Read by tello_ops/tags/detect.py; every value below is required.
family: tag36h11
origin_tag: 10          # this tag's frame becomes the map origin

# Edge length of the BLACK square (not the white border), in mm, per tag id.
# A tag with null size is still detected and gated (angle, ambiguity) but has no distance.
sizes_mm:
  10: 571.5

detector:               # pupil-apriltags options
  quad_decimate: 2.0    # 2 = faster on 960x720; edges are refined back to full resolution
  refine_edges: true
  decode_sharpening: 0.25

gate:                   # a detection is used only if ALL pass
  min_decision_margin: 30.0     # pupil's decode confidence
  min_side_px: 30.0             # shortest tag edge in the image
  # Blur: 10-90% intensity rise across the tag's outer black/white edge, in px
  # (median over 20 profiles). Sharp Tello video is ~1-2 px; motion blur raises it.
  max_edge_width_px: 3.0
  min_edge_contrast: 30.0       # gray levels; flatter profiles are skipped
  max_view_angle_deg: 60.0      # between the tag normal and the ray to the camera
  # IPPE gives two poses (the "flip" ambiguity). ratio = reprojection error of the
  # 2nd-best / best pose; a low ratio means the image cannot tell them apart.
  min_ambiguity_ratio: 3.0
  # ...unless the two poses differ by less than this (near head-on both are ~right).
  ambiguity_ignore_below_deg: 10.0
